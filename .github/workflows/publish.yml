name: Publish

on:
  push:
    tags:
      - v*

permissions:
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt install -y woff2 xmlstarlet

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm i -g bare

      - run: npm ci

      - run: npm run build

      - run: npm run generate:fixtures

      - run: npm test

      - run: npm run generate:font

      - run: npm publish
